# Builds the iPhone app (native/ios) on a Mac. Every run checks it compiles.
# On main, once these four secrets are set (GitHub → Settings → Secrets and
# variables → Actions), it also signs the app and sends it to App Store
# Connect, where it shows up in TestFlight a few minutes later:
#   APPSTORE_KEY_ID      App Store Connect → Users and Access → Integrations → the key's ID
#   APPSTORE_ISSUER_ID   the Issuer ID shown above the keys
#   APPSTORE_KEY_P8      the downloaded AuthKey_XXXX.p8 file's text (the key needs Admin access)
#   APPLE_TEAM_ID        developer.apple.com → Membership details → Team ID
# Signing is automatic: Xcode makes the certificate and profile with that key.
# Push changes under native/ios to send a new build; web changes need no new build.
name: iPhone app

on:
  push:
    paths:
      - 'native/ios/**'
      - 'native/package.json'
      - 'native/capacitor.config.json'
      - '.github/workflows/ios.yml'
      - '.github/scripts/asc-check.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm ci
      - name: Sync web shell and plugins
        run: npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the App Store Connect key with Apple
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey.p8
        run: node .github/scripts/asc-check.js
      - name: Sign and send to App Store Connect (TestFlight)
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]'); TEAM_ID=$(echo "$TEAM_ID" | tr -d '[:space:]')
          # The key check step saved a cleaned-up copy of the key.
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          mv "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # Each upload needs a higher build number; the run number always grows.
          BUILD=$((1000 + ${{ github.run_number }}))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "${AUTH[@]}" archive | tail -60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -60
          rm -f "$KEY"
          echo "Sent build $BUILD to App Store Connect. It appears in TestFlight after Apple processes it (about 10-30 minutes)."
