# Builds the iPhone app (native/ios) on a Mac. Every run checks it compiles.
# On main, once these four secrets are set (GitHub → Settings → Secrets and
# variables → Actions), it also signs the app and sends it to App Store
# Connect, where it shows up in TestFlight a few minutes later:
#   APPSTORE_KEY_ID      App Store Connect → Users and Access → Integrations → the key's ID
#   APPSTORE_ISSUER_ID   the Issuer ID shown above the keys
#   APPSTORE_KEY_P8      the downloaded AuthKey_XXXX.p8 file's text (the key needs Admin access)
#   APPLE_TEAM_ID        developer.apple.com → Membership details → Team ID
# Signing is automatic: Xcode makes the certificate and profile with that key.
# Push changes under native/ios to send a new build; web changes need no new build.
name: iPhone app

on:
  push:
    paths:
      - 'native/ios/**'
      - 'native/package.json'
      - 'native/capacitor.config.json'
      - '.github/workflows/ios.yml'
      - '.github/scripts/asc-check.js'
      - '.github/scripts/asc-sign.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm ci
      - name: Sync web shell and plugins
        run: npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the App Store Connect key with Apple
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey.p8
        run: node .github/scripts/asc-check.js
      - name: Sign and send to App Store Connect (TestFlight)
        id: ship
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]'); TEAM_ID=$(echo "$TEAM_ID" | tr -d '[:space:]')
          export KEY_ID ISSUER_ID TEAM_ID
          # The key check step saved a cleaned-up copy of the key.
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          mv "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          export KEY_FILE="$KEY"
          SIGN="$RUNNER_TEMP/sign"; mkdir -p "$SIGN"

          # 1. A distribution certificate and App Store profile just for this build.
          /usr/bin/openssl genrsa -out "$SIGN/key.pem" 2048
          /usr/bin/openssl req -new -key "$SIGN/key.pem" -out "$SIGN/csr.pem" -subj "/CN=FTB CI/O=$TEAM_ID/C=US"
          node "$GITHUB_WORKSPACE/.github/scripts/asc-sign.js" setup "$SIGN" | tee "$SIGN/out.txt"
          PROFILE_NAME=$(sed -n 's/^NAME=//p' "$SIGN/out.txt"); PROFILE_UUID=$(sed -n 's/^UUID=//p' "$SIGN/out.txt")
          export PROFILE_NAME
          echo "CERT_ID=$(sed -n 's/^CERT_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"
          echo "PROFILE_ID=$(sed -n 's/^PROFILE_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"

          # 2. Into a keychain and Xcode's profile folders.
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/cert.p12" -passout pass:ftbci
          KC="$RUNNER_TEMP/ftb.keychain-db"
          security create-keychain -p ftbci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ftbci "$KC"
          security import "$SIGN/cert.p12" -k "$KC" -P ftbci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ftbci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

          # 3. The app target signs with them (release builds use production notifications).
          perl -0pi -e 's/(504EC3181FED79650016851F \/\* Release \*\/ = \{.*?)CODE_SIGN_STYLE = Automatic;/$1CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/s' App.xcodeproj/project.pbxproj
          sed -i '' 's#<string>development</string>#<string>production</string>#' App/App.entitlements

          # 4. Build, sign and upload. Each upload needs a higher build number.
          BUILD=$((1000 + ${{ github.run_number }}))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" CURRENT_PROJECT_VERSION="$BUILD" archive | tail -60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.feedthebear.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -60
          echo "Sent build $BUILD to App Store Connect. It appears in TestFlight after Apple processes it (about 10-30 minutes)."
      - name: Remove this build's certificate and profile
        if: ${{ always() && env.CERT_ID != '' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey-cleanup.p8
        run: |
          node .github/scripts/asc-check.js >/dev/null
          KEY_FILE="$RUNNER_TEMP/AuthKey-cleanup.p8" node .github/scripts/asc-sign.js cleanup
          security delete-keychain "$RUNNER_TEMP/ftb.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey*.p8
