# Builds the Android app (native/). Always makes a test APK you can install
# on a phone. When the four signing secrets are set (GitHub → Settings →
# Secrets and variables → Actions), it also makes the signed .aab to upload
# to Google Play:
#   ANDROID_KEYSTORE_BASE64  your upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Download the builds from the run's "Artifacts" section.
#
# Every build on main is also published as a GitHub release, so the newest
# app is always at one link (the app shows an "Update" button that opens it):
#   https://github.com/cmc-creator/Feed-The-Bear/releases/latest/download/feed-the-bear.apk
# It's signed with native/android/app/sideload.p12, the same key every time,
# so it installs over the previous version.
name: Android app

on:
  push:
    paths:
      - 'native/**'
      - '!native/ios/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # publish the release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci
      - name: Sync web shell and plugins
        run: npx cap sync android
      - name: Build test APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-bear-test-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the app at the permanent download link
        if: github.ref == 'refs/heads/main'
        working-directory: native/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk feed-the-bear.apk
          gh release create "android-${{ github.run_number }}" feed-the-bear.apk             --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest             --title "Feed The Bear for Android (build ${{ github.run_number }})"             --notes "Open this on your Android phone and install feed-the-bear.apk. It installs over the previous version."
      - name: Signed bundle for Google Play
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: native/android
        env:
          FTB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FTB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FTB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          FTB_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: feed-the-bear-play-bundle
          path: native/android/app/build/outputs/bundle/release/app-release.aab
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
