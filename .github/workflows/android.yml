# Builds the Android app (native/). Always makes a test APK you can install
# on a phone. When the four signing secrets are set (GitHub → Settings →
# Secrets and variables → Actions), it also makes the signed .aab to upload
# to Google Play:
#   ANDROID_KEYSTORE_BASE64  your upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Download the builds from the run's "Artifacts" section.
name: Android app

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci
      - name: Sync web shell and plugins
        run: npx cap sync android
      - name: Build test APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-bear-test-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signed bundle for Google Play
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: native/android
        env:
          FTB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FTB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FTB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          FTB_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: feed-the-bear-play-bundle
          path: native/android/app/build/outputs/bundle/release/app-release.aab
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
