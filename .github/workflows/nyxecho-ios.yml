# DRAFT - prepared 2026-11-22. The nyxecho-ios/ pack folder landed in
# the Feed-The-Bear repo on 2026-11-22 (commit a57ef735); this workflow
# file itself still has to land through the GitHub web UI (workflow
# files cannot be pushed through the connector). To use it, copy this
# file to .github/workflows/nyxecho-ios.yml in the Feed-The-Bear repo,
# next to the nyxecho-ios/ pack folder. The pack's icon-1024.png also
# lands through the web UI. See PREP.md in
# ~/workspace/store-submissions/nyxecho-apple/ for the full plan, and
# NOTES.md beside this file for the deliberate differences from
# nyxsurvive-ios.yml.
#
# Builds the NYXECHO iPhone app (bundle com.nyxcollective.nyxecho) from
# the build pack in nyxecho-ios/: the NyxEcho native shell inputs
# (package.json with @capacitor/ios, capacitor.config.json with the
# server.url shell pointing at https://www.nyxecho.com, the www/
# redirect stub, icon-1024.png) plus App Store signing scripts. This
# workflow lives in the Feed-The-Bear repo because this repo's GitHub
# secrets already hold the working App Store Connect key ("GitHub
# builds", key CSV5ZTC68U); the NyxEcho repo has no Apple secrets of
# its own (Apple's one-time .p8 download would not save in the browser
# used to set it up). Run it manually: Actions -> "NyxEcho iPhone app"
# -> Run workflow. It generates the Xcode project with
# `npx cap add ios`, injects the microphone usage description NyxEcho
# needs (it records meetings in the WebView; without
# NSMicrophoneUsageDescription in Info.plist the app crashes the first
# time the site asks for the microphone), applies the icon, signs, and
# uploads to App Store Connect / TestFlight.
#
# BEFORE THE FIRST RUN (see PREP.md): the bundle ID
# com.nyxcollective.nyxecho must be registered in Certificates,
# Identifiers & Profiles (asc-sign.js refuses to make a profile
# without it) and the NyxEcho app record must exist in App Store
# Connect, or the upload has nowhere to land.
#
# SIGNING AND THE 3-CERTIFICATE CAP: certificates are never deleted
# after a build (deleting revokes, and Apple rejects the binary at
# review, ITMS-90035). The account is at or near Apple's cap of 3
# distribution certificates, so this workflow never mints a new one
# when a saved identity exists. It looks on the "ios-signing-store"
# branch for, in order:
#   1. ios-signing-nyxecho/ - this app's own saved key + certificate +
#      profile (written by the save step on the first successful run).
#   2. ios-signing/ - the shared key + certificate saved by the
#      NyxSurvive workflow. The certificate signs any of Connie's
#      apps; only the profile is per-app, so the sign step then runs
#      asc-sign.js setup-profile to mint just a NyxEcho profile
#      against that certificate.
# Only if neither exists does it mint a fresh certificate (and the
# save step then stores the identity under ios-signing-nyxecho/).
name: NyxEcho iPhone app

on:
  workflow_dispatch:

permissions:
  # write (not read) so the "Save the signing identity" step can
  # push the ios-signing-store branch. Nothing else pushes.
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: nyxecho-ios
    steps:
      - uses: actions/checkout@v4
      - name: Check for a saved signing identity
        id: storecheck
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin ios-signing-store >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A signing store exists on the ios-signing-store branch."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No ios-signing-store branch yet: this run mints one certificate and saves it."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.storecheck.outputs.exists == 'true' }}
        with:
          ref: ios-signing-store
          path: .signing-store
      - name: Restore the saved signing identity
        if: ${{ steps.storecheck.outputs.exists == 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          RESTORE="$RUNNER_TEMP/sign-restore"; mkdir -p "$RESTORE"
          FULL="$GITHUB_WORKSPACE/.signing-store/ios-signing-nyxecho"
          SHARED="$GITHUB_WORKSPACE/.signing-store/ios-signing"
          if [ -d "$FULL" ]; then
            for f in key.pem cert.pem profile.mobileprovision; do
              cat "$FULL/$f.b64."* > "$RESTORE/$f.b64"
              /usr/bin/openssl base64 -d -A -in "$RESTORE/$f.b64" -out "$RESTORE/$f"
              rm -f "$RESTORE/$f.b64"
            done
            cp "$FULL/SHA256SUMS" "$RESTORE/SHA256SUMS"
            (cd "$RESTORE" && shasum -a 256 -c SHA256SUMS)
            cp "$FULL/meta.env" "$RESTORE/meta.env"
            echo "SIGN_RESTORED=full" >> "$GITHUB_ENV"
            echo "Restored the NyxEcho signing identity (key, certificate, profile); fingerprints verified."
          elif [ -d "$SHARED" ]; then
            for f in key.pem cert.pem; do
              cat "$SHARED/$f.b64."* > "$RESTORE/$f.b64"
              /usr/bin/openssl base64 -d -A -in "$RESTORE/$f.b64" -out "$RESTORE/$f"
              rm -f "$RESTORE/$f.b64"
            done
            grep -E ' (key|cert)\.pem$' "$SHARED/SHA256SUMS" > "$RESTORE/SHA256SUMS"
            (cd "$RESTORE" && shasum -a 256 -c SHA256SUMS)
            cp "$SHARED/meta.env" "$RESTORE/meta.env"
            echo "SIGN_RESTORED=cert" >> "$GITHUB_ENV"
            echo "Restored the shared certificate; a NyxEcho profile will be minted in the sign step. No new certificate."
          else
            echo "SIGN_RESTORED=none" >> "$GITHUB_ENV"
            echo "Signing store branch exists but holds no usable identity folder; the sign step will mint and save."
          fi
          echo "SIGN_RESTORE_DIR=$RESTORE" >> "$GITHUB_ENV"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm ci
      - name: Generate the iOS project (not kept in the repo)
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Inject the microphone usage description
        run: |
          # The generated Info.plist has no usage descriptions. NyxEcho
          # records meetings in the WebView and streams the audio to
          # nyxecho.com for transcription, so the app must declare why
          # it wants the microphone, or iOS kills the app at the first
          # recording. Same idea as the RECORD_AUDIO injection in the
          # NyxEcho Android workflow. ITSAppUsesNonExemptEncryption is
          # set false (the app only uses standard HTTPS encryption) so
          # App Store Connect does not ask for export paperwork per build.
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Print :NSMicrophoneUsageDescription" "$PLIST" >/dev/null 2>&1 \
            || "$PB" -c "Add :NSMicrophoneUsageDescription string NyxEcho records your meetings so it can transcribe them and draft your notes." "$PLIST"
          "$PB" -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1 \
            || "$PB" -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          "$PB" -c "Print :NSMicrophoneUsageDescription" "$PLIST"
      - name: Apply the NyxEcho launcher icon
        run: cp icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Sync web shell and plugins
        run: npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: nyxecho-ios/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the App Store Connect key with Apple
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey.p8
        run: node nyxecho-ios/scripts/asc-check.js
      - name: Sign and send to App Store Connect (TestFlight)
        id: ship
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: nyxecho-ios/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.nyxcollective.nyxecho
        run: |
          set -o pipefail
          KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]'); TEAM_ID=$(echo "$TEAM_ID" | tr -d '[:space:]')
          export KEY_ID ISSUER_ID TEAM_ID
          # The key check step saved a cleaned-up copy of the key.
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          mv "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          export KEY_FILE="$KEY"
          SIGN="$RUNNER_TEMP/sign"; mkdir -p "$SIGN"

          # 1. Signing material: restored identity when there is one,
          #    a fresh profile against the restored certificate when
          #    only the certificate was restored, otherwise a minted
          #    pair (which the save step below then stores).
          if [ "${SIGN_RESTORED:-}" = "full" ]; then
            cp "$SIGN_RESTORE_DIR/key.pem" "$SIGN_RESTORE_DIR/cert.pem" "$SIGN_RESTORE_DIR/profile.mobileprovision" "$SIGN/"
            cp "$SIGN_RESTORE_DIR/meta.env" "$SIGN/out.txt"
            echo "Signing with the saved NyxEcho identity (cert $(sed -n 's/^CERT_ID=//p' "$SIGN/out.txt"))."
          elif [ "${SIGN_RESTORED:-}" = "cert" ]; then
            cp "$SIGN_RESTORE_DIR/key.pem" "$SIGN_RESTORE_DIR/cert.pem" "$SIGN/"
            export CERT_ID=$(sed -n 's/^CERT_ID=//p' "$SIGN_RESTORE_DIR/meta.env")
            test -n "$CERT_ID" || { echo "Restored meta.env has no CERT_ID - refusing to guess."; exit 1; }
            node "$GITHUB_WORKSPACE/nyxecho-ios/scripts/asc-sign.js" setup-profile "$SIGN" | tee "$SIGN/out.txt"
          else
            /usr/bin/openssl genrsa -out "$SIGN/key.pem" 2048
            /usr/bin/openssl req -new -key "$SIGN/key.pem" -out "$SIGN/csr.pem" -subj "/CN=NyxEcho CI/O=$TEAM_ID/C=US"
            node "$GITHUB_WORKSPACE/nyxecho-ios/scripts/asc-sign.js" setup "$SIGN" | tee "$SIGN/out.txt"
          fi
          PROFILE_NAME=$(sed -n 's/^NAME=//p' "$SIGN/out.txt"); PROFILE_UUID=$(sed -n 's/^UUID=//p' "$SIGN/out.txt")
          export PROFILE_NAME
          echo "CERT_ID=$(sed -n 's/^CERT_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"
          echo "PROFILE_ID=$(sed -n 's/^PROFILE_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"

          # 2. Into a keychain and Xcode's profile folders.
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/cert.p12" -passout pass:nyxci
          KC="$RUNNER_TEMP/nyx.keychain-db"
          security create-keychain -p nyxci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p nyxci "$KC"
          security import "$SIGN/cert.p12" -k "$KC" -P nyxci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k nyxci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

          # 3. The app target signs with them.
          perl -0pi -e 's/(504EC3181FED79650016851F \/\* Release \*\/ = \{.*?)CODE_SIGN_STYLE = Automatic;/$1CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/s' App.xcodeproj/project.pbxproj

          # 4. Build, sign and upload. Each upload needs a higher build number.
          #    MARKETING_VERSION 1.0: this is NyxEcho's first iOS release.
          BUILD=$((1000 + ${{ github.run_number }}))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" CURRENT_PROJECT_VERSION="$BUILD" MARKETING_VERSION="1.0" archive | tail -60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.nyxcollective.nyxecho</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -60
          echo "Sent build $BUILD to App Store Connect. It appears in TestFlight after Apple processes it (about 10-30 minutes)."
      - name: Save the signing identity for future builds
        if: ${{ steps.ship.outcome == 'success' && env.SIGN_RESTORED != 'full' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SIGN="$RUNNER_TEMP/sign"
          test -f "$SIGN/key.pem" && test -f "$SIGN/cert.pem" && test -f "$SIGN/profile.mobileprovision" || { echo "Signing files missing - nothing to save."; exit 1; }
          WORK="$RUNNER_TEMP/store-repo"; rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ios-signing-store 2>/dev/null; then
            git checkout -q -b ios-signing-store FETCH_HEAD
          else
            git checkout -q --orphan ios-signing-store
          fi
          mkdir -p ios-signing-nyxecho
          rm -f ios-signing-nyxecho/*
          for f in key.pem cert.pem profile.mobileprovision; do
            /usr/bin/openssl base64 -A -in "$SIGN/$f" -out "$RUNNER_TEMP/$f.b64"
            split -b 50000 -d -a 3 "$RUNNER_TEMP/$f.b64" "ios-signing-nyxecho/$f.b64."
            rm -f "$RUNNER_TEMP/$f.b64"
          done
          (cd "$SIGN" && shasum -a 256 key.pem cert.pem profile.mobileprovision) > ios-signing-nyxecho/SHA256SUMS
          cp "$SIGN/out.txt" ios-signing-nyxecho/meta.env
          git add ios-signing-nyxecho
          git commit -q -m "Save NyxEcho iOS signing identity (cert ${CERT_ID})"
          git push -q origin ios-signing-store
          echo "Saved the NyxEcho signing identity to the ios-signing-store branch; future builds reuse it."
      - name: Remove this build's keychain and key copies
        if: ${{ always() }}
        working-directory: .
        run: |
          # The certificate and profile are KEPT at Apple on purpose
          # (see asc-sign.js cleanup): deleting the certificate would
          # revoke it and break this build's signature at review.
          security delete-keychain "$RUNNER_TEMP/nyx.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey*.p8
