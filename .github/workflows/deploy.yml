name: Browser tests (main)

# The site is served by Vercel (it deploys every push to main on its own).
# This only runs the browser tests on main; the old GitHub Pages copy of the
# site was never used and is no longer published from here.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'native/**'      # the Android app has its own workflow
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-main
  cancel-in-progress: true   # a newer push replaces a run still going

jobs:
  test:
    uses: ./.github/workflows/test.yml
