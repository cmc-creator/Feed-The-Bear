# Builds the NYXSURVIVE iPhone app (bundle com.nyxcollective.nyxsurvive)
# from the build pack in nyxsurvive-ios/ - copies of the NyxSurvive
# repo's native shell inputs (package.json, capacitor.config.json,
# www/, icon) plus its App Store signing scripts. This workflow
# lives in the Feed-The-Bear repo because this repo's GitHub
# secrets already hold the working App Store Connect key
# ("GitHub builds"); the NyxSurvive repo has no Apple secrets of
# its own (Apple's one-time .p8 download would not save in the
# browser used to set it up). Run it manually: Actions ->
# "NyxSurvive iPhone app" -> Run workflow. It generates the Xcode
# project with `npx cap add ios`, applies the NyxSurvive icon,
# signs with this repo's four APPSTORE_/APPLE_ secrets, and
# uploads to App Store Connect, where the build lands on the
# NyxSurvive app record once that record is created (bundle ID
# registration + app record happen in the developer portal / App
# Store Connect at submission time). Unlike the sister app whose
# shell loads its live site, NyxSurvive BUNDLES its web assets:
# the pack's www/ is a snapshot made by the NyxSurvive repo's
# native/prepare-www.js. To refresh the pack, re-run that script
# in the NyxSurvive repo and re-copy native/www/, plus the files
# from native/ and assets/icons/ when they change.
#
# DURABLE SIGNING (changed 2026-11-17): the signing identity is no
# longer minted fresh on every run. Before signing, the workflow
# looks for the "ios-signing-store" branch in this repo, which
# holds the shared distribution key + certificate + App Store
# profile as numbered base64 pieces plus a SHA256SUMS fingerprint
# file and the meta.env lines asc-sign.js prints. If the store is
# there, the pieces are reassembled, the fingerprints are checked,
# and that identity signs the build - no new certificate is made.
# If the store is absent (the first run after this change), the
# build mints one certificate exactly as before and then SAVES the
# new key, certificate and profile to ios-signing-store so every
# later build reuses them. That is what keeps the account under
# Apple's 3-distribution-certificate cap for good. A fingerprint
# mismatch stops the build loudly rather than silently minting.
name: NyxSurvive iPhone app

on:
  workflow_dispatch:

permissions:
  # write (not read) so the "Save the signing identity" step can
  # push the ios-signing-store branch. Nothing else pushes.
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: nyxsurvive-ios
    steps:
      - uses: actions/checkout@v4
      - name: Check for a saved signing identity
        id: storecheck
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin ios-signing-store >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A saved signing identity exists on the ios-signing-store branch."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No ios-signing-store branch yet: this run mints one certificate and saves it."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.storecheck.outputs.exists == 'true' }}
        with:
          ref: ios-signing-store
          path: .signing-store
      - name: Restore the saved signing identity
        if: ${{ steps.storecheck.outputs.exists == 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/.signing-store/ios-signing"
          test -d "$STORE" || { echo "ios-signing-store branch has no ios-signing/ folder - refusing to guess."; exit 1; }
          RESTORE="$RUNNER_TEMP/sign-restore"; mkdir -p "$RESTORE"
          for f in key.pem cert.pem profile.mobileprovision; do
            cat "$STORE/$f.b64."* > "$RESTORE/$f.b64"
            /usr/bin/openssl base64 -d -A -in "$RESTORE/$f.b64" -out "$RESTORE/$f"
            rm -f "$RESTORE/$f.b64"
          done
          cp "$STORE/SHA256SUMS" "$RESTORE/SHA256SUMS"
          (cd "$RESTORE" && shasum -a 256 -c SHA256SUMS)
          cp "$STORE/meta.env" "$RESTORE/meta.env"
          echo "SIGN_RESTORE_DIR=$RESTORE" >> "$GITHUB_ENV"
          echo "SIGN_RESTORED=true" >> "$GITHUB_ENV"
          echo "Restored the shared signing identity; fingerprints verified. No new certificate will be made."
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm ci
      - name: Generate the iOS project (not kept in the repo)
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Apply the NyxSurvive launcher icon
        run: cp icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Sync web shell and plugins
        run: npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: nyxsurvive-ios/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the App Store Connect key with Apple
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey.p8
        run: node nyxsurvive-ios/scripts/asc-check.js
      - name: Sign and send to App Store Connect (TestFlight)
        id: ship
        if: ${{ env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: nyxsurvive-ios/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.nyxcollective.nyxsurvive
        run: |
          set -o pipefail
          KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]'); TEAM_ID=$(echo "$TEAM_ID" | tr -d '[:space:]')
          export KEY_ID ISSUER_ID TEAM_ID
          # The key check step saved a cleaned-up copy of the key.
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          mv "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          export KEY_FILE="$KEY"
          SIGN="$RUNNER_TEMP/sign"; mkdir -p "$SIGN"

          # 1. A distribution certificate and App Store profile for this build:
          #    the saved shared identity when one was restored, otherwise a
          #    freshly minted pair (which the save step below then stores).
          if [ "${SIGN_RESTORED:-}" = "true" ] && [ -f "$SIGN_RESTORE_DIR/key.pem" ]; then
            cp "$SIGN_RESTORE_DIR/key.pem" "$SIGN_RESTORE_DIR/cert.pem" "$SIGN_RESTORE_DIR/profile.mobileprovision" "$SIGN/"
            cp "$SIGN_RESTORE_DIR/meta.env" "$SIGN/out.txt"
            echo "Signing with the saved shared identity ($(sed -n 's/^CERT_ID=//p' "$SIGN/out.txt"))."
          else
            /usr/bin/openssl genrsa -out "$SIGN/key.pem" 2048
            /usr/bin/openssl req -new -key "$SIGN/key.pem" -out "$SIGN/csr.pem" -subj "/CN=NyxSurvive CI/O=$TEAM_ID/C=US"
            node "$GITHUB_WORKSPACE/nyxsurvive-ios/scripts/asc-sign.js" setup "$SIGN" | tee "$SIGN/out.txt"
          fi
          PROFILE_NAME=$(sed -n 's/^NAME=//p' "$SIGN/out.txt"); PROFILE_UUID=$(sed -n 's/^UUID=//p' "$SIGN/out.txt")
          export PROFILE_NAME
          echo "CERT_ID=$(sed -n 's/^CERT_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"
          echo "PROFILE_ID=$(sed -n 's/^PROFILE_ID=//p' "$SIGN/out.txt")" >> "$GITHUB_ENV"

          # 2. Into a keychain and Xcode's profile folders.
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/cert.p12" -passout pass:nxci
          KC="$RUNNER_TEMP/nx.keychain-db"
          security create-keychain -p nxci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p nxci "$KC"
          security import "$SIGN/cert.p12" -k "$KC" -P nxci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k nxci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

          # 3. The app target signs with them (release builds use production notifications).
          perl -0pi -e 's/(504EC3181FED79650016851F \/\* Release \*\/ = \{.*?)CODE_SIGN_STYLE = Automatic;/$1CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/s' App.xcodeproj/project.pbxproj

          # 4. Build, sign and upload. Each upload needs a higher build number.
          BUILD=$((1000 + ${{ github.run_number }}))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" CURRENT_PROJECT_VERSION="$BUILD" MARKETING_VERSION="1.3" archive | tail -60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.nyxcollective.nyxsurvive</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -60
          echo "Sent build $BUILD to App Store Connect. It appears in TestFlight after Apple processes it (about 10-30 minutes)."
      - name: Save the signing identity for future builds
        if: ${{ steps.ship.outcome == 'success' && env.SIGN_RESTORED != 'true' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SIGN="$RUNNER_TEMP/sign"
          test -f "$SIGN/key.pem" && test -f "$SIGN/cert.pem" && test -f "$SIGN/profile.mobileprovision" || { echo "Signing files missing - nothing to save."; exit 1; }
          WORK="$RUNNER_TEMP/store-repo"; rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ios-signing-store 2>/dev/null; then
            git checkout -q -b ios-signing-store FETCH_HEAD
          else
            git checkout -q --orphan ios-signing-store
          fi
          mkdir -p ios-signing
          rm -f ios-signing/*
          for f in key.pem cert.pem profile.mobileprovision; do
            /usr/bin/openssl base64 -A -in "$SIGN/$f" -out "$RUNNER_TEMP/$f.b64"
            split -b 50000 -d -a 3 "$RUNNER_TEMP/$f.b64" "ios-signing/$f.b64."
            rm -f "$RUNNER_TEMP/$f.b64"
          done
          (cd "$SIGN" && shasum -a 256 key.pem cert.pem profile.mobileprovision) > ios-signing/SHA256SUMS
          cp "$SIGN/out.txt" ios-signing/meta.env
          git add ios-signing
          git commit -q -m "Save shared iOS signing identity (cert ${CERT_ID})"
          git push -q origin ios-signing-store
          echo "Saved the signing identity to the ios-signing-store branch; future builds reuse it."
      - name: Remove this build's certificate and profile
        if: ${{ always() && env.CERT_ID != '' }}
        working-directory: .
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_OUT: ${{ runner.temp }}/AuthKey-cleanup.p8
        run: |
          node .github/scripts/asc-check.js >/dev/null
          KEY_FILE="$RUNNER_TEMP/AuthKey-cleanup.p8" node nyxsurvive-ios/scripts/asc-sign.js cleanup
          security delete-keychain "$RUNNER_TEMP/nx.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey*.p8
