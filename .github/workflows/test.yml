name: Browser tests

on:
  push:
    branches-ignore:
      - main   # main runs these through deploy.yml before deploying
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    # Pinned: the browser install (playwright --with-deps) fails on Ubuntu 26,
    # which ubuntu-latest moved to in Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright-core install --with-deps chromium

      - name: Serve the site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/app.html >/dev/null && break; sleep 1; done

      - name: Smoke test (every page and feature opens cleanly)
        working-directory: tests
        run: node smoke.test.js

      - name: Foodie flows
        working-directory: tests
        run: node flows.test.js

      - name: Friends
        working-directory: tests
        run: node friends.test.js

      - name: Photo storage
        working-directory: tests
        run: node photos.test.js

      - name: Bear Swipe
        working-directory: tests
        run: node swipe.test.js

      - name: Upgrade paths
        working-directory: tests
        run: node money.test.js

      - name: Quick Add and the cub
        working-directory: tests
        run: node cub.test.js

      - name: Food videos
        working-directory: tests
        run: node video.test.js
      - name: First-run welcome
        working-directory: tests
        run: node welcome.test.js
      - name: Usage dashboard
        working-directory: tests
        run: node usage.test.js
      - name: Story cards
        working-directory: tests
        run: node story.test.js
      - name: Home screen
        working-directory: tests
