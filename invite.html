<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Invite links point here so texts and chats show an inviting preview.
       It forwards straight to the app, keeping ?ref= (free month) and
       #profile= (the inviter's picks) exactly as they were. -->
  <title>You're invited to Feed The Bear</title>
  <meta name="description" content="Follow my food picks: where I eat, what I order, and what I'm craving. Free to join." />
  <meta property="og:title" content="You're invited to Feed The Bear 🐻" />
  <meta property="og:description" content="Follow my food picks: where I eat, what I order, and what I'm craving. Free to join." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.feed-the-bear.com/invite.html" />
  <meta property="og:image" content="https://www.feed-the-bear.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#1b241c" />
  <script>location.replace('app.html' + location.search + location.hash);</script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b241c; color: #f6ecdc; font: 600 1rem system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #ffd98a; }
  </style>
</head>
<body>
  <p>Opening your invite… <a id="go" href="app.html">Tap here if nothing happens</a></p>
  <script>document.getElementById('go').href = 'app.html' + location.search + location.hash;</script>
</body>
</html>
